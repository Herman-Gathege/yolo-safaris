<body data-page="home">

  <!-- SITE.nav and SITE.headerCta -->
  <header class="site-header" data-render="header"></header>

    <!-- SITE.home.itinerary -->

    <!-- SITE.home.impact -->

    <!-- SITE.home.tripStyles -->
    <section class="section" data-render="points" data-key="home.tripStyles"></section>

    <!-- SITE.home.faq -->
    <section class="section section--tint" data-render="faq" data-key="home.faq"></section>

    <!-- SITE.home.closing -->
    <section class="section" data-render="closing" data-key="home.closing"></section>
