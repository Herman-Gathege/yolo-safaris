<body data-page="contact">
  <a class="skip-link" href="#main" data-text="ui.skipToContent"></a>

  <header class="site-header" data-render="header"></header>

  <main id="main">
    <!-- SITE.contactPage title and one line of context -->
    <section class="section" data-render="page-head" data-key="contactPage"></section>

    <!-- SITE.form (the booking form) and SITE.contactPage.direct -->
    <section class="section section--tight" data-render="contact"></section>

    <!-- SITE.contactPage.next -->
    <section class="section" data-render="points" data-key="contactPage.next"></section>

    <!-- SITE.contactPage.payment
         TODO(owner): the deposit and payment wording in js/content.js is a
         placeholder. Confirm the amounts and due dates before launch. -->
    <section class="section section--tint" data-render="prose" data-key="contactPage.payment"></section>
  </main>

  <footer class="site-footer" data-render="footer"></footer>

  <a class="whatsapp-float" data-href="contact.whatsappHref" data-text="contact.whatsappLabel"
     data-aria="ui.whatsappFloat" aria-label=""></a>

      <p>Phone or WhatsApp <a href="tel:+254727720566">+254 727 720 566</a> ·
         Email <a href="mailto:yolosafaris@gmail.com">yolosafaris@gmail.com</a></p>
    </div>
